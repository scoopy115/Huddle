[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huddle-engine"
version = "0.9.0"
description = "Huddle's processing engine: transcription, speaker separation, notes, MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.24",
  "soundfile>=0.12.1",
  "faster-whisper>=1.1",
  "huggingface-hub>=0.24",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "sherpa-onnx>=1.12",
  "mcp>=1.2",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "parakeet-mlx>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
huddle-engine = "huddle_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["huddle_engine*"]
